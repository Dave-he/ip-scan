# IP Scanner Configuration

[api]
enabled = true
host = "0.0.0.0"
port = 9090

[scan]
ports = "21,22,23,25,53,80,110,143,443,445,3306,3389,5432,6379,8080,8443,9200,27017"
timeout = 500
# Run at full throughput by default; bounded by the operating system's
# TCP backlog / network bandwidth. Raise only if a specific network has
# headroom beyond the current saturation point.
concurrency = 4000
geo_concurrency = 8
database = "scan_results.db"
verbose = false
loop_mode = false
ipv4 = true
ipv6 = false
only_store_open = true
skip_private = true
syn = false

[rate_limit]
# 0 = unlimited (token bucket is bypassed; concurrency is the only
# throttling knob). Any positive value is packets-per-second.
max_rate = 0
window_duration = 1

# Optional cluster / node identity block. The standalone distributed frontend
# uses these fields to label the scanner node, place it on the map view, and
# group results by source. All fields are optional; missing values fall back
# to `api.host:api.port`. CLI flags (--node-id / --node-label / ...) take
# precedence when provided.
#
# [node]
# id = "node-ali"
# label = "ali-shanghai"
# provider = "Aliyun"
# latitude = 31.2304
# longitude = 121.4737

# Bandwidth benchmark mode (--bench-bandwidth). Only consulted when the
# flag is set; all fields are optional and merge with the corresponding
# CLI flag (CLI wins when both are present).
#
# [bench]
# concurrency = 100            # in-flight GETs per round
# bytes_per_target = 1048576   # 1 MiB per Range request
# rounds = 5
# min_rounds = 3
# stop_cv_throughput = 0.10    # CV(bw) over the last 3 rounds
# stop_cv_rtt = 0.15           # CV(rtt) over the last 3 rounds
# timeout_secs = 10
# output_dir = "results/bandwidth"
# domain_file = "lists/cn_top_1000.csv"

# IP Scanner Configuration

[api]
enabled = true
host = "0.0.0.0"
port = 9090

[scan]
ports = "21,22,23,25,53,80,110,143,443,445,3306,3389,5432,6379,8080,8443,9200,27017"
timeout = 500
# Run at full throughput by default; bounded by the operating system's
# TCP backlog / network bandwidth. Raise only if a specific network has
# headroom beyond the current saturation point.
concurrency = 4000
geo_concurrency = 8
database = "scan_results.db"
verbose = false
loop_mode = false
ipv4 = true
ipv6 = false
only_store_open = true
skip_private = true
syn = false

[rate_limit]
# 0 = unlimited (token bucket is bypassed; concurrency is the only
# throttling knob). Any positive value is packets-per-second.
max_rate = 0
window_duration = 1
